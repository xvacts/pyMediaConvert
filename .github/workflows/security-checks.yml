name: Security Regression Checks

on:
  push:
    branches: [main, '1.13', codex/security-audit-20261023]
  pull_request:
    branches: [main, '1.13']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - name: Install project and security test dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements.txt pytest pip-audit
      - name: Check Python syntax
        run: python -m compileall -q MediaTools.py install_dependencies.py archive_utils.py pyMediaTools
      - name: Run offline security regression tests
        run: python -m pytest tests/test_security_boundaries.py -q
      - name: Audit installed dependency versions
        run: python -m pip_audit --local
